<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
</head>
<body>
<main id="main-holder">
    <a href="/logout" id="logout">Logout</a>

    <h1 id="login-header">Login</h1>

    <a href="/api/login" id="login-button">Login with Auth0</a>

    <h1 id="signup-header">Sign Up</h1>
    <form id="signup-form" action="/api/signup" method="post">
        <input type="text" name="signup-username" id="signup-username-field" class="login-form-field" placeholder="Username">
        <input type="password" name="signup-password" id="signup-password-field" class="login-form-field" placeholder="Password">
        <input type="submit" value="Sign Up" id="signup-form-submit">
    </form>
</main>

<script>
    const logoutLink = document.getElementById("logout");
    const loginButton = document.getElementById("login-button");
    const signupForm = document.getElementById("signup-form");
    const signupButton = document.getElementById("signup-form-submit");

    async function checkSession() {
        try {
            const response = await axios.get("/", { headers: { Accept: "application/json" } });
            console.log(response.data);

            const { username } = response.data;
            if (username) {
                document.getElementById("login-header").textContent = `Hello ${username}`;
                loginButton.remove();
                signupForm.remove();
                logoutLink.style.opacity = 1;
            }
        } catch (err) {
            // не залогінений, нічого не робимо
        }
    }

    logoutLink.addEventListener("click", (e) => {
        e.preventDefault();
        window.location.href = "/logout";
    });

    signupButton.addEventListener("click", async (e) => {
        e.preventDefault();
        const signupUsername = signupForm["signup-username"].value;
        const signupPassword = signupForm["signup-password"].value;

        try {
            await axios.post("/api/signup", {
                login: signupUsername,
                password: signupPassword
            });
            alert("Signup successful!");
        } catch (error) {
            alert("Signup failed!");
        }
    });

    checkSession();
</script>
</body>
</html>
